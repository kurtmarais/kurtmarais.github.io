<footer class="pt-5 mt-5 text-muted border-top">
  <div class="footer-row">
    <div class="footer-brand"><strong>{{ site.title }}</strong><br>{{ site.description }}</div>

    <nav class="footer-links" aria-label="Footer navigation">
      <ul class="footer-links-list list-unstyled">
        <li><a class="footer-link{% if page.url == '/' %} is-current{% endif %}" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        <li><a class="footer-link{% if page.url == '/about/' %} is-current{% endif %}" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a class="footer-link{% if page.url == '/supervision/' %} is-current{% endif %}" href="{{ '/supervision/' | relative_url }}"{% if page.url == '/supervision/' %} aria-current="page"{% endif %}>Supervision</a></li>
        <li><a class="footer-link{% if page.url == '/engagements/' %} is-current{% endif %}" href="{{ '/engagements/' | relative_url }}"{% if page.url == '/engagements/' %} aria-current="page"{% endif %}>Engagements</a></li>
        <li><a class="footer-link{% if page.url == '/cv/' %} is-current{% endif %}" href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a></li>
        <li><a class="footer-link{% if page.url == '/teaching/' %} is-current{% endif %}" href="{{ '/teaching/' | relative_url }}"{% if page.url == '/teaching/' %} aria-current="page"{% endif %}>Teaching</a></li>
        <li><a class="footer-link{% if page.url == '/publications/' %} is-current{% endif %}" href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a></li>
      </ul>
    </nav>

    <div class="social-media-icons">
       {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer" class="ms-3 fs-5" aria-label="{{ item.icon }}"><i class="{{ item.icon }}"></i></a>
      {% endfor %}
    </div>
  </div>
  <div class="small mt-4">© 2026 {{ site.title }}</div> 
</footer>
