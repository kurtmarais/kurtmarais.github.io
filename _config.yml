url: "https://kurtmarais.github.io"
baseurl: ""
title: "Kurt Marais"
description: "Lecturer and researcher in Operations Research and Business Analytics at Stellenbosch University, working on NLP, sentiment diffusion and social network analysis."
lang: "en"
markdown: kramdown
permalink: /:categories/:title/
collections:
  publications:
    output: true
    permalink: /publications/:slug/
  posters:
    output: true
    permalink: /posters/:slug/
  videos:
    output: true
    permalink: /videos/:slug/
plugins:
  - jekyll-feed
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - academic.gemspec
  - vendor
  - brand
  - CLAUDE.md
  - CHANGELOG.md
  - README.md
  - "**/README.md"
show_media: true

# Floating awareness button (top left, every page): shown only between
# `start` and `end` (inclusive, checked in the visitor's browser, so it
# switches on and off without a rebuild). Hidden on the page it links to.
# Delete or comment out this block to remove the button entirely.
awareness_button:
  start: "2026-10-01"
  end: "2026-10-31"
  url: "/videos/world-mental-health-day-2026/"
  label: "World Mental Health Day 2026 · Watch the video"
  icon: "fa-video"          # shown while the text is open
  closed_icon: "fa-ribbon"  # shown when it shrinks to the round button

# Google Analytics — set to your GA4 Measurement ID to enable tracking,
# or comment out / delete this line to disable it site-wide without
# touching head.html.
google_analytics_id: "G-L8ESWJ4M12"

# CV sections — comment out any one of these lines to hide that
# section from the CV page entirely (the section's data file can stay
# in place either way; commenting the flag is all that's needed).
show_cv_awards: false
show_cv_associations: true
show_cv_grants: false
show_cv_service: false
show_cv_professional_development: false
show_cv_graduated_students: true
show_cv_links: true
