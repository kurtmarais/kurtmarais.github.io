<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 9 46 46">
  <!--
    Adaptive favicon, v2 (deployed as assets/img/favicon.svg).
    Same favicon-weight geometry as logo-solid-favicon.svg, cropped tight:
    the viewBox (7.5 9 46 46) leaves about 2 units around the mark, so it
    fills ~95% of a browser tab icon instead of ~70% (at 16px the mark is
    ~15px wide rather than ~11px).

    Colours switch with the visitor's OS/browser scheme (prefers-color-scheme;
    Chrome, Firefox, Edge). Safari ignores the media query and shows the
    light state, which is why favicon.ico still ships.
      light: forest hub #365b52, mint arms/nodes #6ea491 (brand colours)
      dark:  cream hub #f7f6f1, mint arms/nodes #9ab8aa (the site's dark-mode
             link colour), so the hub stays the heaviest element and the
             two-tone shape still reads on dark tab bars.
    This follows the system theme, not the site's own dark-mode toggle.
  -->
  <style>
    .kn-arc  { fill: none; stroke: #6ea491; stroke-width: 5; stroke-linecap: round; }
    .kn-arm  { stroke: #6ea491; stroke-width: 5.5; stroke-linecap: round; }
    .kn-hub  { fill: #365b52; }
    .kn-node { fill: #6ea491; }

    @media (prefers-color-scheme: dark) {
      .kn-arc  { stroke: #9ab8aa; }
      .kn-arm  { stroke: #9ab8aa; }
      .kn-hub  { fill: #f7f6f1; }
      .kn-node { fill: #9ab8aa; }
    }
  </style>
  <path class="kn-arc" d="M 46,46 A 20,20 0 1,1 46,18"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="46"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="18"/>
  <circle class="kn-hub" cx="32" cy="32" r="10"/>
  <circle class="kn-node" cx="46" cy="46" r="5.5"/>
  <circle class="kn-node" cx="46" cy="18" r="5.5"/>
  <circle class="kn-node" cx="18" cy="18" r="4.5"/>
</svg>
