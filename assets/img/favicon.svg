<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon-optimized: thicker strokes and larger nodes than the primary
    mark, so nothing thins out to invisible at 16-32px. Two-tone kept
    (not flattened to one color) because the dark hub vs. lighter
    connectors gives real shape recognition at tiny sizes that a flat
    silhouette loses — tested against both light and dark browser tab
    chrome, this mint tone reads clearly on both.
  -->
  <style>
    .kn-arc  { fill: none; stroke: #6ea491; stroke-width: 5; stroke-linecap: round; }
    .kn-arm  { stroke: #6ea491; stroke-width: 5.5; stroke-linecap: round; }
    .kn-hub  { fill: #365b52; }
    .kn-node { fill: #6ea491; }
  </style>
  <path class="kn-arc" d="M 46,46 A 20,20 0 1,1 46,18"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="46"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="18"/>
  <circle class="kn-hub" cx="32" cy="32" r="10"/>
  <circle class="kn-node" cx="46" cy="46" r="5.5"/>
  <circle class="kn-node" cx="46" cy="18" r="5.5"/>
  <circle class="kn-node" cx="18" cy="18" r="4.5"/>
</svg>
