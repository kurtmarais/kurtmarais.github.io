<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Monochrome, cream (#f7f6f1) — same thick favicon-weight geometry as
    logo-solid-favicon.svg / logo-greyscale-favicon.svg, single hue
    throughout (matching logo-mono-light.svg's treatment: hub, arms and
    nodes at full opacity, the arc slightly dimmer to keep some depth).
    For dark backgrounds only — on a light tab this will be close to
    invisible. Use logo-solid-favicon or logo-greyscale-favicon for
    general/light-tab use.
  -->
  <style>
    .kn-arc  { fill: none; stroke: #f7f6f1; stroke-width: 5; stroke-linecap: round; opacity: 0.55; }
    .kn-arm  { stroke: #f7f6f1; stroke-width: 5.5; stroke-linecap: round; }
    .kn-hub  { fill: #f7f6f1; }
    .kn-node { fill: #f7f6f1; }
  </style>
  <path class="kn-arc" d="M 46,46 A 20,20 0 1,1 46,18"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="46"/>
  <line class="kn-arm" x1="32" y1="32" x2="46" y2="18"/>
  <circle class="kn-hub" cx="32" cy="32" r="10"/>
  <circle class="kn-node" cx="46" cy="46" r="5.5"/>
  <circle class="kn-node" cx="46" cy="18" r="5.5"/>
  <circle class="kn-node" cx="18" cy="18" r="4.5"/>
</svg>
