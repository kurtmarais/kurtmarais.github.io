- title: "From Social Media to Mental Well-being: Modelling the Spread of Emotion in Online Networks"
  media_format: poster
  url: "/posters/from-social-media-to-mental-wellbeing/"
  image: "/assets/img/engagements/poster-thumb.jpg"
  publication: "EMS Research Impact Day, Stellenbosch University"        # inferred from filename — confirm/replace with the real venue if this was a specific conference
  location: "Faculty of Economic and Management Sciences, Stellenbosch University"
  start_date: "2026-09-15"
  end_date: "2026-09-15"
  year: 2026
  type: "poster"
  featured: false
  map:                            # conference map on the Engagements page
    city: "Stellenbosch"
    region: "Western Cape, South Africa"
    lat: -33.9321
    lon: 18.8602
  description: "A summary of research on emotional contagion and sentiment diffusion in online mental health communities, and its implications beyond academia."
  keywords:
    - research impact
    - social media
    - mental health
    - depression
  authors:
    - "Kurt Marais"
  poster_pdf: "/assets/posters/EMS_Research_Impact_Poster_2026.pdf"
  pdf_width: 2383.92
  pdf_height: 3370.32
  abstract: |
    This research explores how affective information (particularly sentiment related to depression) spreads through online social networks and what that means beyond the academic context. The work is framed by infodemiology and emotional contagion theories, and identifies *emotional reinforcement* as a phenomenon where socially connected individuals experience intensified, longer-lasting shared emotion when they hold the same diagnosis and emotional state, with particular relevance for people experiencing depression. The research has since informed conversations with social media users about platform developers, mental health practitioners and policymakers. 
    
    The work details opportunities advocating for user-controlled tools that reduce algorithmic influence, as well as producing tools for individuals experiencing mental health concerns through the information obtained from social platforms. The work has also reached a wider public audience through national and local media coverage, with further pathways for impact detailing collaboration with other researchers and funders to advance digital well-being.


